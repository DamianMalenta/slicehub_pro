<!DOCTYPE html>
<html lang="pl">
<head><meta charset="UTF-8"><title>SPARK auth inject</title></head>
<body>
<script>
const p = new URLSearchParams(location.search);
const token = p.get('token');
const user = p.get('user');
const redirect = p.get('redirect') || '/slicehub/modules/hub/index.html';
if (token && user) {
  localStorage.setItem('sh_token', token);
  localStorage.setItem('sh_user', user);
  location.replace(redirect);
} else {
  document.body.textContent = 'Missing token or user';
}
</script>
</body>
</html>
