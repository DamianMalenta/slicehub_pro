<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maciuś — Prototyp Conversational Surface</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fraunces:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #0a0806;
            --card: rgba(255,255,255,0.05);
            --card-border: rgba(255,255,255,0.08);
            --gold: #e8b04b;
            --gold-dim: rgba(232,176,75,0.12);
            --gold-glow: rgba(232,176,75,0.35);
            --orange: #c2410c;
            --green: #15803d;
            --text: #f3efe8;
            --muted: #a0988d;
            --font: "DM Sans", system-ui, sans-serif;
            --serif: "Fraunces", serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            font-family: var(--font);
            background: radial-gradient(ellipse at 50% 0%, #2a1f17 0%, #0f0b08 55%, #050302 100%);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── TOPBAR ── */
        .topbar {
            position: sticky; top: 0; z-index: 40;
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 20px;
            background: linear-gradient(180deg, rgba(10,8,6,.95), rgba(10,8,6,.8));
            backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(232,176,75,.08);
            box-shadow: 0 12px 32px rgba(0,0,0,.35);
        }
        .topbar__brand { display: flex; align-items: center; gap: 10px; }
        .topbar__mark {
            width: 40px; height: 40px; border-radius: 10px;
            display: grid; place-items: center;
            background: linear-gradient(135deg, #e8b04b, #c2410c 85%);
            color: #1a0f07; font-size: 16px;
            box-shadow: 0 6px 18px rgba(194,65,12,.4);
        }
        .topbar__name { font-family: var(--serif); font-weight: 800; font-size: 16px; color: #fff; }
        .topbar__sub { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
        .topbar__sub i { color: var(--gold); font-size: 9px; }

        .topbar__center { display: flex; align-items: center; gap: 12px; }
        .ch-switch {
            display: inline-flex; background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.08); border-radius: 999px; padding: 3px;
        }
        .ch-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 14px; border: 0; background: transparent;
            color: var(--muted); font-size: 12px; font-weight: 700;
            border-radius: 999px; cursor: pointer; font-family: inherit;
        }
        .ch-btn.active {
            background: linear-gradient(135deg, #e8b04b, #d97706);
            color: #1a0f07;
            box-shadow: 0 4px 14px rgba(217,119,6,.45);
        }
        .topbar__cart {
            position: relative; width: 44px; height: 44px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.05);
            color: #fff; font-size: 17px; cursor: pointer;
            display: grid; place-items: center;
        }
        .topbar__cart-badge {
            position: absolute; top: -5px; right: -5px;
            min-width: 18px; height: 18px; padding: 0 5px;
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            color: #fff; font-size: 10px; font-weight: 800;
            border-radius: 999px; display: grid; place-items: center;
            border: 2px solid var(--bg);
        }

        /* ── HERO ── */
        .hero {
            text-align: center; padding: 36px 20px 16px;
            animation: fadeUp .7s cubic-bezier(.2,.9,.3,1) both;
        }
        .hero__eyebrow {
            font-size: 10.5px; letter-spacing: .28em; text-transform: uppercase;
            color: var(--gold); font-weight: 700; margin-bottom: 8px;
        }
        .hero__title {
            font-family: var(--serif); font-size: clamp(28px, 5.5vw, 48px);
            font-weight: 800; line-height: 1.05; color: #fff;
            text-shadow: 0 4px 20px rgba(0,0,0,.5);
        }
        .hero__title em {
            font-style: italic; font-weight: 700;
            background: linear-gradient(135deg, #f4c678, #e8b04b 60%, #d97706);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero__lead {
            margin: 10px auto 16px; color: var(--muted);
            font-size: 14px; line-height: 1.5; max-width: 460px;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── MENU SURFACE ── */
        .surface { max-width: 720px; margin: 0 auto; padding: 20px 18px 220px; }

        .section-head {
            display: flex; justify-content: space-between; align-items: flex-end;
            margin: 0 0 14px; gap: 10px;
        }
        .section-kicker {
            font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
            color: var(--gold); font-weight: 700;
        }
        .section-title {
            font-family: var(--serif); font-size: 22px; font-weight: 800;
            color: #fff; letter-spacing: -.015em;
        }
        .section-hint { color: #8b8477; font-size: 11px; }

        /* Popular carousel */
        .popular-track {
            display: flex; gap: 12px; overflow-x: auto;
            padding: 4px 0 16px; scroll-snap-type: x mandatory;
            scrollbar-width: none;
        }
        .popular-track::-webkit-scrollbar { display: none; }

        .pop-card {
            flex: 0 0 160px; border: 1px solid var(--card-border);
            border-radius: 16px; background: var(--card);
            overflow: hidden; cursor: pointer; color: var(--text);
            font-family: inherit; text-align: left;
            transition: all .25s cubic-bezier(.2,.9,.3,1);
            scroll-snap-align: start;
            box-shadow: 0 8px 20px rgba(0,0,0,.3);
            position: relative;
        }
        .pop-card:hover { transform: translateY(-3px); border-color: var(--gold-glow); }

        /* GLOW effect for Macius recommendations */
        .pop-card.macius-glow {
            border-color: var(--gold) !important;
            box-shadow: 0 0 24px rgba(232,176,75,.3), 0 8px 20px rgba(0,0,0,.3) !important;
            animation: glowPulse 2s ease-in-out infinite;
        }
        .pop-card.macius-glow::after {
            content: 'Maciuś poleca';
            position: absolute; top: 8px; right: 8px; z-index: 2;
            padding: 3px 8px; border-radius: 999px;
            background: linear-gradient(135deg, #e8b04b, #d97706);
            color: #1a0f07; font-size: 9px; font-weight: 800;
            letter-spacing: .04em;
        }
        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 24px rgba(232,176,75,.25), 0 8px 20px rgba(0,0,0,.3); }
            50% { box-shadow: 0 0 36px rgba(232,176,75,.45), 0 8px 20px rgba(0,0,0,.3); }
        }

        .pop-card__media {
            width: 100%; aspect-ratio: 4/3;
            background: radial-gradient(ellipse at 50% 35%, rgba(232,176,75,.1), transparent 70%), #161310;
            display: grid; place-items: center; font-size: 32px; color: rgba(232,176,75,.3);
            position: relative; overflow: hidden;
        }
        .pop-card__media img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .pop-card__rank {
            position: absolute; top: 8px; left: 8px;
            padding: 3px 8px; border-radius: 999px;
            background: rgba(0,0,0,.6); color: var(--gold);
            font-size: 10px; font-weight: 800; backdrop-filter: blur(4px);
            border: 1px solid rgba(232,176,75,.25);
        }
        .pop-card__body { padding: 10px 12px; }
        .pop-card__name {
            font-family: var(--serif); font-weight: 700; font-size: 14px;
            color: #fff; line-height: 1.15;
        }
        .pop-card__price {
            margin-top: 4px; font-size: 14px; font-weight: 800;
            color: var(--gold); font-variant-numeric: tabular-nums;
        }

        /* Menu tickets */
        .menu-section { margin-bottom: 32px; }
        .cat-head {
            width: 100%; display: flex; align-items: center; gap: 12px;
            padding: 14px 16px; border: 1px solid var(--card-border);
            border-radius: 14px; background: var(--card);
            cursor: pointer; color: #fff; font-family: inherit;
            margin-bottom: 8px; transition: all .2s;
        }
        .cat-head:hover { border-color: rgba(232,176,75,.2); background: rgba(232,176,75,.04); }
        .cat-head__icon {
            width: 38px; height: 38px; border-radius: 10px;
            background: var(--gold-dim); border: 1px solid rgba(232,176,75,.2);
            color: var(--gold); display: grid; place-items: center; font-size: 16px;
            flex-shrink: 0;
        }
        .cat-head__title { font-family: var(--serif); font-weight: 700; font-size: 16px; flex: 1; text-align: left; }
        .cat-head__count {
            font-size: 10px; font-weight: 800; color: var(--gold);
            background: var(--gold-dim); border: 1px solid rgba(232,176,75,.2);
            padding: 2px 8px; border-radius: 999px;
        }
        .cat-head__chev {
            width: 8px; height: 8px; border-right: 2px solid var(--gold);
            border-bottom: 2px solid var(--gold); transform: rotate(-45deg);
            transition: transform .2s;
        }
        .cat-head.open .cat-head__chev { transform: rotate(45deg); }

        .cat-body { display: flex; flex-direction: column; gap: 6px; padding: 0 0 6px; }
        .cat-body.hidden { display: none; }

        .ticket {
            display: grid; grid-template-columns: 72px 1fr auto;
            gap: 12px; align-items: center; padding: 10px;
            border: 1px solid rgba(255,255,255,.05); border-radius: 12px;
            background: rgba(255,255,255,.02); cursor: pointer;
            transition: all .22s cubic-bezier(.2,.9,.3,1);
            position: relative;
        }
        .ticket:hover {
            background: rgba(255,255,255,.05); border-color: rgba(232,176,75,.3);
            transform: translateX(2px);
        }
        .ticket.macius-glow {
            border-color: var(--gold) !important;
            background: rgba(232,176,75,.06) !important;
            box-shadow: 0 0 20px rgba(232,176,75,.15);
            animation: glowPulse 2s ease-in-out infinite;
        }
        .ticket.macius-glow::before {
            content: '';
            position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
            background: linear-gradient(180deg, #e8b04b, #d97706);
        }

        .ticket__thumb {
            width: 72px; height: 72px; border-radius: 10px;
            background: radial-gradient(ellipse at 50% 35%, rgba(232,176,75,.1), transparent 70%), #161310;
            display: grid; place-items: center; font-size: 24px;
            color: rgba(232,176,75,.25); overflow: hidden; flex-shrink: 0;
        }
        .ticket__thumb img { width: 100%; height: 100%; object-fit: cover; }
        .ticket__name { font-family: var(--serif); font-weight: 700; font-size: 15px; color: #fff; }
        .ticket__desc { font-size: 11.5px; color: var(--muted); line-height: 1.35; margin-top: 2px; }
        .ticket__price {
            font-size: 14px; font-weight: 800; color: var(--gold);
            padding: 5px 8px; background: var(--gold-dim);
            border: 1px solid rgba(232,176,75,.15); border-radius: 8px;
            white-space: nowrap;
        }

        /* ══════════════════════════════════════════════════════════════
           MACIUŚ STRIP — the conversational surface
           ══════════════════════════════════════════════════════════════ */

        .macius-strip {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
            background: linear-gradient(180deg, rgba(10,8,6,.0) 0%, rgba(10,8,6,.95) 15%, rgba(10,8,6,.98) 100%);
            padding: 12px 16px 16px;
            transform: translateY(100%);
            transition: transform .4s cubic-bezier(.2,.9,.3,1);
        }
        .macius-strip.visible { transform: translateY(0); }

        .macius-strip__inner {
            max-width: 720px; margin: 0 auto;
        }

        /* Message bubble */
        .macius-msg {
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 16px 16px 16px 4px;
            padding: 12px 16px;
            margin-bottom: 10px;
            backdrop-filter: blur(12px);
            animation: msgIn .35s cubic-bezier(.2,.9,.3,1) both;
            position: relative;
        }
        .macius-msg::before {
            content: '';
            position: absolute; left: -1px; top: 0; bottom: 0; width: 3px;
            background: linear-gradient(180deg, var(--gold), #d97706);
            border-radius: 3px 0 0 3px;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px) scale(.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .macius-msg__head {
            display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
        }
        .macius-msg__avatar {
            width: 24px; height: 24px; border-radius: 8px;
            background: linear-gradient(135deg, #e8b04b, #d97706);
            display: grid; place-items: center;
            font-size: 12px; color: #1a0f07; font-weight: 800;
        }
        .macius-msg__label {
            font-size: 11px; font-weight: 700; color: var(--gold);
            letter-spacing: .04em;
        }
        .macius-msg__text {
            font-size: 14px; line-height: 1.5; color: #e7e2d9;
        }

        /* Suggestion chips */
        .macius-chips {
            display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px;
            animation: msgIn .35s cubic-bezier(.2,.9,.3,1) both .1s;
        }
        .macius-chip {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 10px 14px; border-radius: 999px;
            border: 1px solid rgba(232,176,75,.25);
            background: rgba(232,176,75,.08);
            color: var(--gold); font-size: 13px; font-weight: 700;
            cursor: pointer; font-family: inherit;
            transition: all .2s cubic-bezier(.2,.9,.3,1);
            white-space: nowrap;
        }
        .macius-chip:hover {
            background: rgba(232,176,75,.18);
            border-color: rgba(232,176,75,.5);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(232,176,75,.2);
        }
        .macius-chip:active { transform: scale(.96); }
        .macius-chip--primary {
            background: linear-gradient(135deg, #e8b04b, #d97706);
            color: #1a0f07; border-color: transparent;
            box-shadow: 0 4px 14px rgba(217,119,6,.35);
        }
        .macius-chip--primary:hover {
            box-shadow: 0 8px 24px rgba(217,119,6,.5);
        }
        .macius-chip--subtle {
            border-color: rgba(255,255,255,.1);
            color: var(--muted);
            background: rgba(255,255,255,.04);
        }
        .macius-chip--subtle:hover { color: #fff; border-color: rgba(255,255,255,.2); }

        /* Input bar */
        .macius-input {
            display: flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 999px; padding: 4px 4px 4px 16px;
            transition: border-color .2s;
        }
        .macius-input:focus-within { border-color: rgba(232,176,75,.4); }
        .macius-input__field {
            flex: 1; border: 0; background: transparent;
            color: var(--text); font-size: 14px; font-family: inherit;
            outline: none; min-width: 0;
        }
        .macius-input__field::placeholder { color: #6b6560; }
        .macius-input__btn {
            width: 36px; height: 36px; border-radius: 50%;
            border: 0; cursor: pointer; font-size: 14px;
            display: grid; place-items: center;
            transition: all .2s;
        }
        .macius-input__mic {
            background: rgba(232,176,75,.12); color: var(--gold);
        }
        .macius-input__mic:hover { background: rgba(232,176,75,.25); }
        .macius-input__mic.listening {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            color: #fff; animation: micPulse 1s ease-in-out infinite;
        }
        @keyframes micPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,.4); }
            50% { box-shadow: 0 0 0 8px rgba(239,68,68,0); }
        }
        .macius-input__send {
            background: linear-gradient(135deg, #e8b04b, #d97706);
            color: #1a0f07;
        }
        .macius-input__send:hover { box-shadow: 0 4px 12px rgba(217,119,6,.4); }

        /* Minimize toggle */
        .macius-toggle {
            position: fixed; bottom: 16px; right: 16px; z-index: 51;
            width: 48px; height: 48px; border-radius: 50%;
            background: linear-gradient(135deg, #e8b04b, #d97706);
            color: #1a0f07; border: 0; cursor: pointer;
            font-size: 20px; display: grid; place-items: center;
            box-shadow: 0 6px 24px rgba(217,119,6,.4);
            transition: all .3s cubic-bezier(.2,.9,.3,1);
        }
        .macius-toggle:hover { transform: scale(1.08); }
        .macius-toggle.hidden { display: none; }

        /* Typing indicator */
        .macius-typing {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 8px 14px; border-radius: 12px;
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.08);
            margin-bottom: 10px;
        }
        .macius-typing span {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--gold); opacity: .4;
            animation: typeDot 1.4s ease-in-out infinite;
        }
        .macius-typing span:nth-child(2) { animation-delay: .15s; }
        .macius-typing span:nth-child(3) { animation-delay: .3s; }
        @keyframes typeDot {
            0%, 60%, 100% { opacity: .3; transform: scale(.8); }
            30% { opacity: 1; transform: scale(1.1); }
        }

        /* Cart toast */
        .cart-toast {
            position: fixed; top: 72px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: linear-gradient(135deg, var(--green), #166534);
            color: #fff; padding: 10px 20px; border-radius: 12px;
            font-size: 13px; font-weight: 700; z-index: 60;
            box-shadow: 0 8px 24px rgba(21,128,61,.4);
            transition: transform .3s cubic-bezier(.2,.9,.3,1);
            display: flex; align-items: center; gap: 8px;
        }
        .cart-toast.show { transform: translateX(-50%) translateY(0); }

        /* User message */
        .macius-user-msg {
            background: rgba(232,176,75,.1);
            border: 1px solid rgba(232,176,75,.2);
            border-radius: 16px 16px 4px 16px;
            padding: 10px 14px;
            margin-bottom: 10px;
            font-size: 14px; color: #e7e2d9;
            text-align: right;
            animation: msgIn .3s cubic-bezier(.2,.9,.3,1) both;
        }

        /* Promo ambient banner */
        .promo-banner {
            text-align: center; padding: 8px 16px;
            background: linear-gradient(90deg, rgba(232,176,75,.08), rgba(232,176,75,.15), rgba(232,176,75,.08));
            border-top: 1px solid rgba(232,176,75,.15);
            border-bottom: 1px solid rgba(232,176,75,.15);
            font-size: 12px; font-weight: 700; color: var(--gold);
            letter-spacing: .06em;
            animation: fadeUp .5s both .3s;
        }
        .promo-banner.hidden { display: none; }

        /* Scenario selector (prototype UI) */
        .proto-bar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 8px 16px;
            display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
            border-bottom: 2px solid #e8b04b;
            font-size: 12px;
        }
        .proto-bar__label {
            color: #e8b04b; font-weight: 800; font-size: 11px;
            letter-spacing: .1em; text-transform: uppercase; margin-right: 8px;
        }
        .proto-btn {
            padding: 5px 12px; border-radius: 6px;
            border: 1px solid rgba(232,176,75,.3);
            background: rgba(232,176,75,.08);
            color: #e8b04b; font-size: 11px; font-weight: 700;
            cursor: pointer; font-family: inherit;
            transition: all .15s;
        }
        .proto-btn:hover { background: rgba(232,176,75,.2); }
        .proto-btn.active { background: var(--gold); color: #1a0f07; border-color: var(--gold); }

        /* Adjust layout for proto bar */
        body { padding-top: 44px; }

        /* ── RESPONSIVE ── */
        @media (max-width: 500px) {
            .hero__title { font-size: 26px; }
            .topbar__center { display: none; }
            .pop-card { flex: 0 0 140px; }
            .macius-chip { font-size: 12px; padding: 8px 12px; }
        }

        /* ── Confirmation overlay ── */
        .confirm-overlay {
            position: fixed; inset: 0; z-index: 55;
            background: rgba(0,0,0,.6); backdrop-filter: blur(6px);
            display: grid; place-items: center;
            animation: fadeUp .25s both;
        }
        .confirm-overlay.hidden { display: none; }
        .confirm-card {
            background: #1a1714; border: 1px solid rgba(232,176,75,.2);
            border-radius: 20px; padding: 24px; width: min(92%, 380px);
            box-shadow: 0 24px 60px rgba(0,0,0,.6);
        }
        .confirm-card h3 {
            font-family: var(--serif); font-size: 18px; color: #fff;
            margin-bottom: 14px;
        }
        .confirm-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.06);
            font-size: 14px;
        }
        .confirm-item__name { color: #e7e2d9; }
        .confirm-item__price { color: var(--gold); font-weight: 700; }
        .confirm-total {
            display: flex; justify-content: space-between; margin-top: 12px;
            font-weight: 800; font-size: 16px;
        }
        .confirm-total span:last-child { color: var(--gold); }
        .confirm-actions { display: flex; gap: 8px; margin-top: 18px; }
        .confirm-actions button {
            flex: 1; padding: 12px; border-radius: 12px;
            font-family: inherit; font-size: 14px; font-weight: 700;
            cursor: pointer; border: 0;
        }
        .confirm-actions .btn-yes {
            background: linear-gradient(135deg, #e8b04b, #d97706);
            color: #1a0f07;
        }
        .confirm-actions .btn-no {
            background: rgba(255,255,255,.06);

// ── Helpers ──

function clearGlow() {
    document.querySelectorAll('.macius-glow').forEach(el => el.classList.remove('macius-glow'));
}

function setGlow(skus) {
    clearGlow();
    skus.forEach(sku => {
        document.querySelectorAll(`[data-sku="${sku}"]`).forEach(el => {
            el.classList.add('macius-glow');
            el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
        });
    });
}

function showToast(text) {
    const toast = document.getElementById('cart-toast');
    document.getElementById('cart-toast-text').textContent = text;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
}

function updateCart(count) {
    cartItems += (count || 1);
    document.getElementById('cart-count').textContent = cartItems;
    const badge = document.getElementById('cart-count');
    badge.style.transform = 'scale(1.3)';
    setTimeout(() => badge.style.transform = 'scale(1)', 200);
}

function toggleCat(btn) {
    btn.classList.toggle('open');
    const body = btn.nextElementSibling;
    body.classList.toggle('hidden');
}

function openCat(id) {
    const body = document.getElementById(id);
    if (body && body.classList.contains('hidden')) {
        body.classList.remove('hidden');
        const head = body.previousElementSibling;
        if (head) head.classList.add('open');
        setTimeout(() => body.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
    }
}

function openStrip() {
    document.getElementById('macius-strip').classList.add('visible');
    document.getElementById('macius-toggle').classList.add('hidden');
}

function minimizeStrip() {
    document.getElementById('macius-strip').classList.remove('visible');
    document.getElementById('macius-toggle').classList.remove('hidden');
}

// ── Render step ──

function findStep(scenario, actionId) {
    return scenario.steps.find(s => s.id === actionId);
}

function renderStep(step, scenario) {
    const content = document.getElementById('macius-content');
    let html = '';

    // User message (if any)
    if (step.userMsg) {
        html += `<div class="macius-user-msg">${step.userMsg}</div>`;
    }

    // Add to cart
    if (step.addToCart) {
        updateCart(step.addToCart.count || 1);
        showToast(`${step.addToCart.name} — ${step.addToCart.price}`);
    }

    // Show promo banner
    if (step.showPromo) {
        document.getElementById('promo-banner').classList.remove('hidden');
    }

    // Confirmation overlay (voice)
    if (step.confirm) {
        const overlay = document.getElementById('confirm-overlay');
        const card = document.getElementById('confirm-card');
        card.innerHTML = `
            <h3><i class="fa-solid fa-wand-magic-sparkles" style="color:var(--gold);margin-right:8px"></i>Macius rozumie</h3>
            ${step.confirm.items.map(i => `<div class="confirm-item"><span class="confirm-item__name">${i.name}</span><span class="confirm-item__price">${i.price}</span></div>`).join('')}
            <div class="confirm-total"><span>Razem</span><span>${step.confirm.total}</span></div>
            <div class="confirm-actions">
                <button class="btn-no" onclick="document.getElementById('confirm-overlay').classList.add('hidden')">Popraw</button>
                <button class="btn-yes" onclick="document.getElementById('confirm-overlay').classList.add('hidden'); executeAction('voice_confirmed', SCENARIOS['${currentScenario}'])">Dodaj wszystko ${step.confirm.total}</button>
            </div>
        `;
        overlay.classList.remove('hidden');
    }

    // Voice demo (simulate listening)
    if (step.voiceDemo) {
        html += `<div class="macius-typing"><span></span><span></span><span></span></div>`;
        content.innerHTML = html;
        // Simulate mic listening
        const micBtn = document.querySelector('.macius-input__mic');
        if (micBtn) { micBtn.classList.add('listening'); }

        setTimeout(() => {
            if (micBtn) micBtn.classList.remove('listening');
            const resultStep = findStep(scenario, 'voice_result');
            if (resultStep) renderStep(resultStep, scenario);
        }, 2000);
        return;
    }

    // Bot message
    if (step.msg) {
        html += `
            <div class="macius-msg">
                <div class="macius-msg__head">
                    <div class="macius-msg__avatar">M</div>
                    <span class="macius-msg__label">Macius</span>
                </div>
                <div class="macius-msg__text">${step.msg}</div>
            </div>
        `;
    }

    // Chips
    if (step.chips && step.chips.length > 0) {
        html += '<div class="macius-chips">';
        step.chips.forEach(chip => {
            const cls = chip.style === 'primary' ? 'macius-chip--primary' :
                        chip.style === 'subtle' ? 'macius-chip--subtle' : '';
            html += `<button class="macius-chip ${cls}" onclick="executeAction('${chip.action}', SCENARIOS['${currentScenario}'])">
                <i class="fa-solid ${chip.icon}"></i> ${chip.label}
            </button>`;
        });
        html += '</div>';
    }

    // Input bar
    html += `
        <div class="macius-input">
            <input class="macius-input__field" type="text" placeholder="Wpisz lub powiedz czego szukasz..." 
                   onkeydown="if(event.key==='Enter'){handleTextInput(this.value, SCENARIOS['${currentScenario}']); this.value='';}" />
            <button class="macius-input__btn macius-input__mic" title="Mow do Maciusia" onclick="simulateMic()"><i class="fa-solid fa-microphone"></i></button>
            <button class="macius-input__btn macius-input__send" title="Wyslij"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    `;

    content.innerHTML = html;

    // Glow
    if (step.glow && step.glow.length > 0) {
        setGlow(step.glow);
    } else {
        clearGlow();
    }

    // Open category if needed
    if (step.openCat) {
        openCat(step.openCat);
    }
}

function executeAction(actionId, scenario) {
    if (actionId === 'minimize') {
        minimizeStrip();
        return;
    }
    if (actionId === 'cart') {
        showToast('Otwieram koszyk...');
        return;
    }
    const step = findStep(scenario, actionId);
    if (step) {
        renderStep(step, scenario);
    }
}

function handleTextInput(text, scenario) {
    if (!text.trim()) return;
    const lower = text.toLowerCase();
    // Simple keyword matching for prototype
    let targetId = null;
    if (lower.includes('ostr') || lower.includes('pikant') || lower.includes('spicy')) targetId = 'spicy';
    else if (lower.includes('lekk') || lower.includes('salat') || lower.includes('diet')) targetId = 'light';
    else if (lower.includes('gluten')) targetId = 'gf';
    else if (lower.includes('wegan') || lower.includes('vegan') || lower.includes('roslin')) targetId = 'vegan';

    const content = document.getElementById('macius-content');
    const userHtml = `<div class="macius-user-msg">${text}</div>`;

    if (targetId) {
        const step = findStep(scenario, targetId);
        if (step) {
            const modStep = { ...step, userMsg: null };
            content.innerHTML = userHtml + content.innerHTML;
            setTimeout(() => renderStep(modStep, scenario), 400);
            return;
        }
    }

    // Fallback
    content.innerHTML = userHtml;
    setTimeout(() => {
        renderStep({
            msg: 'Hmm, nie znalazlem dokladnego dopasowania. Sprobuj kliknac kategorie powyzej albo powiedz inaczej — np. "cos ostrego" lub "bez glutenu".',
            chips: [
                { label: 'Bestsellery', icon: 'fa-fire', action: 'next' },
                { label: 'Pokaz menu', icon: 'fa-list', style: 'subtle', action: 'menu' },
            ],
            glow: [],
        }, scenario);
    }, 500);
}

function simulateMic() {
    const micBtn = document.querySelector('.macius-input__mic');
    if (!micBtn) return;
    micBtn.classList.add('listening');
    setTimeout(() => {
        micBtn.classList.remove('listening');
        showToast('Rozpoznawanie mowy wymaga HTTPS + mikrofon');
    }, 2000);
}

// ── Scenario loader ──

function loadScenario(name) {
    currentScenario = name;
    cartItems = 0;
    document.getElementById('cart-count').textContent = '0';
    document.getElementById('promo-banner').classList.add('hidden');
    document.getElementById('confirm-overlay').classList.add('hidden');
    clearGlow();

    // Update proto bar buttons
    document.querySelectorAll('.proto-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');

    const scenario = SCENARIOS[name];
    if (!scenario) return;

    // Show strip
    document.getElementById('macius-strip').classList.add('visible');
    document.getElementById('macius-toggle').classList.add('hidden');

    // Render initial step (always first)
    const content = document.getElementById('macius-content');
    content.innerHTML = '<div class="macius-typing"><span></span><span></span><span></span></div>';

    setTimeout(() => {
        renderStep(scenario.steps[0], scenario);
    }, 600);
}

// ── Init ──
window.addEventListener('DOMContentLoaded', () => {
    const strip = document.getElementById('macius-strip');
    const content = document.getElementById('macius-content');

    // Initial load — typing then greeting
    content.innerHTML = '<div class="macius-typing"><span></span><span></span><span></span></div>';

    setTimeout(() => {
        strip.classList.add('visible');
    }, 300);

    setTimeout(() => {
        renderStep(SCENARIOS.new.steps[0], SCENARIOS.new);
    }, 1200);
});
</script>
</body>
